[project]
site_url = "https://lenskit.org/"
site_name = "LensKit"
site_description = "LensKit Documentation"
site_author = "Michael Ekstrand and LensKit Contributors"

copyright = "Copyright &copy; 2018–2026 Drexel University, Boise State University, and contributors."

repo_url = "https://github.com/lenskit/lkpy"
repo_name = "lenskit/lkpy"
# edit_uri = "edit/main/docs/"

# nav = [{ "Home" = "index.md" }]
# nav = [{ "Get started" = "index.md" }, { "Markdown in 5min" = "markdown.md" }]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lenskit/lkpy"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://recsys.social/@LensKit"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.awesome-nav]

[project.plugins.mkdocstrings]
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://docs.scipy.org/doc/scipy/objects.inv",
  "https://docs.pytorch.org/docs/stable/objects.inv",
  "https://arrow.apache.org/docs/objects.inv",
  "https://docs.pydantic.dev/latest/objects.inv",
  "https://scikit-learn.org/stable/objects.inv",
  "https://docs.ray.io/en/latest/objects.inv",
]
summary = true

# [project.plugins.api-autonav]
# modules = ["src/lenskit"]

[project.plugins.autoapi]
autoapi_dir = "src"
autoapi_add_nav_entry = "API Reference"

# [project.plugins.offline]
